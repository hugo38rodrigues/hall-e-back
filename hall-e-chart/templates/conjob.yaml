{{- if .Values.cron.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "hall-e.fullname" . }}-cron
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: {{ .Values.cron.schedule | quote }}                             # ex: "*/10 * * * *"
  concurrencyPolicy: {{ default "Allow" .Values.cron.concurrencyPolicy }}   # Allow | Forbid | Replace
  suspend: {{ default false .Values.cron.suspend }}                         # doit être false pour exécuter
  successfulJobsHistoryLimit: {{ .Values.cron.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cron.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            job-origin: {{ include "hall-e.fullname" . }}-cron
        spec:
          restartPolicy: OnFailure
          {{- if .Values.cron.imagePullSecrets }}
          imagePullSecrets:
          {{- range .Values.cron.imagePullSecrets }}
            - name: {{ . }}
          {{- end }}
          {{- else }}
          imagePullSecrets:
            - name: docker-login
          {{- end }}
          containers:
            - name: cron
              image: "{{- if .Values.cron.image.registry }}{{ .Values.cron.image.registry }}/{{ end }}{{ .Values.cron.image.repository }}:{{ .Values.cron.image.tag }}"
              imagePullPolicy: {{ default "IfNotPresent" .Values.cron.image.pullPolicy }}
              {{- with .Values.cron.command }}
              command: {{ toJson . }}
              {{- end }}
              {{- with .Values.cron.args }}
              args: {{ toJson . }}
              {{- end }}
              envFrom:
                - configMapRef:
                    name: hall-e-configmap
                - secretRef:
                    name: secret-mongo-prod
                - secretRef:
                    name: secret-cron-job
{{- end }}
  