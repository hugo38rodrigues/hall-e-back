# values.yaml
global:
  imagePullSecrets:
    - docker-login
    
database:
  enabled: true
  name: mongodb
  labels: mongodb
  fullnameOverride: "mongo"
  image:
    repository: mongo
    tag: 7.0             
    pullPolicy: IfNotPresent
  service:
    port: 27017
    annotations: {}
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  nodeSelector: {}
  tolerations: []
  affinity: {}


cron:
  enabled: true
  image: xwdrblue/match_recoveries:1.0.0
  command: [] # optionnel: override command
  args: [] # optionnel: override args
  schedule: '10 * * * *' # Toute les 10 mins
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  

api_hall_e:
  image:
    registry: docker.io
    repository: xwdrblue/api-hall-e
    tag: 1.0.0
  command: []
  enabled: true
  args: []
  env:
    JWT_EXPIRATION: 3h
    PORT: 3000
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

ingress:
  enabled: false

