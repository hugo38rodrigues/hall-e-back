name: CI/CD for hall-e API

on:
  push:
    branches:  
      - main 
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🛠 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: 🔐 GitHub Token pour dépendances privées
      run: |
        git config --global url."https://${{ secrets.ACCESS_TOKEN_GITHUB }}:@github.com/".insteadOf "https://github.com/"
        git config --global url."https://${{ secrets.ACCESS_TOKEN_GITHUB }}:@github.com/".insteadOf "git@github.com:"

    - name: 🔧 Setup .npmrc pour GitHub Packages
      run: |
        echo "@xwdrblue:registry=https://npm.pkg.github.com" > .npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ secrets.ACCESS_TOKEN_GITHUB }}" >> .npmrc
      working-directory: ./app
    
    - name: 🔄 Rewrite SSH URLs to HTTPS for CI
      run: |
        sed -i 's#git@github.com:#https://<${{secrets.ACCESS_TOKEN_GITHUB}}>@github.com/#g' package.json
        sed -i 's#git+ssh://git@github.com/#https://<${{secrets.ACCESS_TOKEN_GITHUB}}>@github.com/#g' package.json
      working-directory: ./app


    - name: 📦 Install dependencies
      run: npm ci
      working-directory: ./app

    - name: 🧹 Lint
      run: npm run lint
      working-directory: ./app

    - name: 🧪 Test
      run: npm test
      working-directory: ./app

  deploy:
    name: 🚀 Push image to Docker Hub
    needs: build
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🔖 Lire version de app/package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version app/package.json)
          echo "IMAGE_TAG=version-$VERSION" >> $GITHUB_ENV

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ Build Docker image
        run: docker build \
          --build-arg ACCESS_TOKEN_GITHUB=${{ secrets.ACCESS_TOKEN_GITHUB }} \
          -t xwdrblue/api-hall-e:${{ env.IMAGE_TAG }} ./app

      - name: 📦 Push Docker image
        run: docker push xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}
