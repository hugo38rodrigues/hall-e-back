name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check if it's a merge commit
        id: check_merge
        run: |
          echo "IS_MERGE=$(git log -1 --pretty=%P | wc -w)" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" > ~/.npmrc
          npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Get version from package.json
        id: version
        run: |
          echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_ENV
          echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      - name: Log in to Docker
        if: env.IS_MERGE == '2'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: ⚙️ Build docker image
        if: env.IS_MERGE == '2'
        run: |
          docker build -t \
          --build-arg ACCESS_TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }} \
          ${{ secrets.DOCKER_USERNAME }}/api-hall-e:${{ env.VERSION }} ./app

      - name: 📦 Push to registry
        if: env.IS_MERGE == '2'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/api-hall-e:${{ env.VERSION }}
