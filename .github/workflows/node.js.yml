name: CI/CD for hall-e API

on:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # - uses: actions/checkout@v4

      - name: Use GitHub token for private repo
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |
          # Forcer l'usage de HTTPS au lieu de SSH
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://".insteadOf "ssh://git@"

          # Authentifier avec le token GitHub
          git config --global url."https://${TOKEN_GITHUB}@github.com/".insteadOf "https://github.com/"
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./app/package-lock.json
      - name: Cache npm dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('./app/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 🧪 Install dependencies
        run: npm ci
        working-directory: ./app

      - name: 🧹 Lint
        run: npm run lint
        working-directory: ./app

      - name: 🧪 Test
        run: npm test
        working-directory: ./app

  deploy:
    name: 🚀 Push images in docker Hub
    needs: build
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Lire version de package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version app/package.json)
          echo "IMAGE_TAG=version-$VERSION" >> $GITHUB_ENV

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ Build docker image
        run: docker build \
          --build-arg ACCESS_TOKEN_GITHUB=${{ secrets.TOKEN_GITHUB }} \
          -t xwdrblue/api-hall-e:${{ env.IMAGE_TAG }} ./app

      - name: 📦 Push to registry
        run: docker push xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}
