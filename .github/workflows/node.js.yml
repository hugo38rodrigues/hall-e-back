name: CI/CD Pipeline

on:
  push:
    branches: ["main", "feature/**", "bugFix/**"]
  pull_request:
    branches: ["feature/**", "bugFix/**"]

permissions:
  contents: read
  packages: read

jobs:
  lint-and-test:
    name: "🔍 Lint & Test"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize npm config
        run: |
          rm -f .npmrc || true
          rm -f ~/.npmrc || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@hugo38rodrigues"
          always-auth: true

      - name: Verify GitHub Packages token
        if: ${{ env.GH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: npm whoami --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_TOKEN }}

      - name: Install dependencies
        if: ${{ env.GH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.GH_TOKEN }}

      - name: Run linter
        if: ${{ env.GH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: npm run lint

      - name: Run tests
        if: ${{ env.GH_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: npm run test

      - name: Skip install on forked PR (no secrets)
        if: ${{ env.GH_TOKEN == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: echo "::notice::Skipping npm install/tests (no secrets on forked PRs)."

  deploy:
    name: "🚀 Deploy"
    runs-on: ubuntu-latest
    needs: lint-and-test
    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@hugo38rodrigues"
          always-auth: true

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: "Deploy (Serverless)"
        env:
         AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
         AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         AWS_REGION: ${{ secrets.AWS_REGION }}
         SECRETS_MANAGER_ARN: ${{ secrets.SECRETS_MANAGER_ARN}}
        run: npx serverless deploy
