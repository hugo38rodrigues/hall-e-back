name: CI/CD for hall-e API

on:
  push:
    branches:  
    - main 
    - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x]

    steps:
    - uses: actions/checkout@v4

    - name: 🔐 Setup .npmrc for GitHub Packages
      run: |
        echo "@xwdrblue:registry=https://npm.pkg.github.com" > .npmrc
        echo "//npm.pkg.github.com/:_authToken=${ACCESS_TOKEN_GITHUB}" >> .npmrc
      env:
        NPM_TOKEN: ${{ secrets.ACCESS_TOKEN_GITHUB }}

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Inject GitHub token dans package.json
      run: |
       git config --global url."https://${{ secrets.ACCESS_TOKEN_GITHUB }}:@github.com/".insteadOf "https://github.com/"


    - name: 🧪 Install dependencies
      run: npm ci

    - name: 🧹 Lint
      run: npm run lint

    - name: 🧪 Test
      run: npm test

  deploy:
    name: 🚀 Push images in docker Hub
    needs: build
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Lire version de package.json
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "IMAGE_TAG=version-$VERSION" >> $GITHUB_ENV

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ build docker image 
        run: docker build \
          --build-arg ACCESS_TOKEN_GITHUB=${{ secrets.ACCESS_TOKEN_GITHUB }} \
          -t xwdrblue/api-hall-e:${{ env.IMAGE_TAG }} .

      - name: 📦 Push to registry
        run: docker push xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}
