name: CI/CD Pipeline

on:
  push:
    branches: ["main", "features/**", "bugFix/**"]
  pull_request:
    branches: ["features/**", "bugFix/**"]

jobs:
  lint-and-test:
    name: "🔍 Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      # Auth npm pour installer devDeps pendant les tests
      - name: Configure npm auth (GitHub Packages)
        run: |
          echo "@hugo38rodrigues:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_TOKEN }}" >> ~/.npmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - run: npm run lint
      - run: npm run test

  build-and-push:
    name: "🐳 Build & Push Docker Image"
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Setup Buildx
        run: |
          docker buildx create --use
          docker buildx inspect --bootstrap

      - name: Build & Push
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg GITHUB_TOKEN=${{ secrets.GH_TOKEN }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/api-hall-e:${{ env.VERSION }} \
            --push .
