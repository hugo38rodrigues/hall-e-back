name: CI/CD for hall-e API

on:
  push:
    branches:  
    - main 
    - 'feature/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [23.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Configure SSH access
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        git config --global url."git@github.com:".insteadOf "https://github.com/"

    - name: 🐛 Debug SSH access (temporaire)
      run: ssh -T git@github.com || true

    - name: 🧪 Install dependencies
      run: npm ci

    - name: 🧹 Lint
      run: npm run lint

    - name: 🧪 Test
      run: npm test

  deploy:
    name: 🚀 Push images in docker Hub
    needs: build
    if: |
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'Merge pull request') &&
      contains(github.event.head_commit.message, 'feature/')

    steps:
    
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
      - name: Lire version de package.json
        id: get_version
        run: 
          VERSION=$(jq -r .version package.json)
          echo "IMAGE_TAG=version-$VERSION" >> $GITHUB_ENV

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ build docker image 
        run: docker build -t xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}

      - name: 📦 Push to registry
        run: docker push xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}
