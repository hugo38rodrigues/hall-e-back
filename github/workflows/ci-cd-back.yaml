name: CI/CD for hall-e API

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches:
      - main
      - feature/*

jobs:
  ci:
    name: 🔍 Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Cache npm deps
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 🧪 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🧪 Test
        run: npm test

  cd:
    name: 🚀 Push images in docker Hub
    needs: ci
    if: |
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, 'Merge pull request') &&
      contains(github.event.head_commit.message, 'feature/')

    steps:
    
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3
      - name: Lire version de package.json
        id: get_version
        run: 
          VERSION=$(jq -r .version package.json)
          echo "IMAGE_TAG=version-$VERSION" >> $GITHUB_ENV

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: ⚙️ build docker image 
        run: docker build -t xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}

      - name: 📦 Push to registry
        run: docker xwdrblue/api-hall-e:${{ env.IMAGE_TAG }}
